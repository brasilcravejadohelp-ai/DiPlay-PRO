name: RadarAlerta
options:
  bundleIdPrefix: com.radaralertasp
  deploymentTarget:
    iOS: "16.0"
targets:
  RadarAlerta:
    type: application
    platform: iOS
    sources:
      - RadarAlerta
    settings:
      base:
        PRODUCT_NAME: RadarAlerta
        PRODUCT_BUNDLE_IDENTIFIER: com.radaralertasp.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    info:
      path: RadarAlerta/Info.plist
      properties:
        CFBundleDisplayName: Radar SP
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location, audio]
        NSLocationWhenInUseUsageDescription: O Radar SP usa sua localização para avisar quando um radar estiver à frente.
        NSLocationAlwaysAndWhenInUseUsageDescription: Com "Sempre", o Radar SP continua avisando dos radares com a tela bloqueada, com outro app aberto ou no CarPlay.
        NSLocationAlwaysUsageDescription: O Radar SP continua avisando dos radares em segundo plano.
